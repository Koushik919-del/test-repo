<script src="script.js"></script>
    <script>
        // Set Doom Protocol countdown to 10 seconds
        var timeLeft = 10;
        var doomTimerEl = document.getElementById('doom-timer');
        var doomTriggered = false;

        // Global Audio Context initialized safely
        var audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Unlock browser audio restrictions on the first interaction anywhere
        window.addEventListener('click', initAudioContext, { once: true });
        window.addEventListener('keydown', initAudioContext, { once: true });

        function updateDoomTimer() {
            if (doomTriggered) return;
            
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            doomTimerEl.innerText = "Doom Protocol: " + minutes.toString().padStart(2, '0') + ":" + seconds.toString().padStart(2, '0');
            
            // Trigger glitch effect 2 seconds before Doom Protocol completes
            if (timeLeft === 2) {
                triggerGlitchEffect();
            }

            if (timeLeft <= 0) {
                triggerDoomProtocol();
            } else {
                timeLeft--;
            }
        }

        function triggerGlitchEffect() {
            initAudioContext();

            if (audioCtx) {
                var oscillator = audioCtx.createOscillator();
                var gainNode = audioCtx.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                oscillator.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.5);
            }

            var desktop = document.getElementById('desktop');
            var originalFilter = desktop.style.filter;
            var glitchInterval = setInterval(function() {
                desktop.style.filter = "invert(1) hue-rotate(90deg)";
                setTimeout(function() { desktop.style.filter = "invert(0)"; }, 50);
                setTimeout(function() { desktop.style.filter = "hue-rotate(180deg)"; }, 100);
                setTimeout(function() { desktop.style.filter = originalFilter; }, 150);
            }, 200);

            setTimeout(function() {
                clearInterval(glitchInterval);
                desktop.style.filter = originalFilter;
            }, 1800);
        }
        
        function playDoomAlarmSound() {
            initAudioContext();
            if (!audioCtx) return;

            // Synthesis of a deep sci-fi pulsing alarm
            var osc1 = audioCtx.createOscillator();
            var osc2 = audioCtx.createOscillator();
            var gain = audioCtx.createGain();

            osc1.type = 'sawtooth';
            osc2.type = 'square';

            osc1.frequency.setValueAtTime(65.41, audioCtx.currentTime); // Low C note
            osc2.frequency.setValueAtTime(130.81, audioCtx.currentTime); // Pitch layer

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

            // Pulsing effect
            var lfo = audioCtx.createOscillator();
            var lfoGain = audioCtx.createGain();
            lfo.frequency.setValueAtTime(1.5, audioCtx.currentTime); // 1.5 Hz pulse rate
            lfoGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            lfo.connect(lfoGain);
            lfoGain.connect(gain.gain);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            lfo.start();
        }

        function triggerDoomProtocol() {
            doomTriggered = true;
            doomTimerEl.innerText = "DOOM PROTOCOL ACTIVE";
            doomTimerEl.style.color = "#0f0";
            doomTimerEl.style.borderColor = "#0f0";
            
            // 1. News Ticker Shift
            var newsScroll = document.getElementById('news-scroll-text');
            newsScroll.style.color = "#00ff00";
            newsScroll.style.animationDuration = "45s"; 
            var doomNewsText = "ALL HAIL DR. DOOM &nbsp;&bull;&nbsp; ALL HAIL DR. DOOM &nbsp;&bull;&nbsp; ALL HAIL DR. DOOM &nbsp;&bull;&nbsp; ALL HAIL DR. DOOM &nbsp;&bull;&nbsp; ALL HAIL DR. DOOM &nbsp;&bull;&nbsp; ALL HAIL DR. DOOM &nbsp;&bull;&nbsp;";
            newsScroll.innerHTML = doomNewsText.repeat(3);
            
            // 2. Visual Takeover
            var desktop = document.getElementById('desktop');
            desktop.style.background = "linear-gradient(135deg, #052b05 0%, #0a520a 100%)";
            document.getElementById('doom-overlay').style.display = 'flex';
            
            // 3. Icon Swaps
            var spideyIcon = document.getElementById('spidey-icon');
            spideyIcon.querySelector('i').innerText = '🦠';
            spideyIcon.querySelector('span').innerText = 'Symbiote Tracker';
            
            var spideyTaskbar = document.getElementById('spidey-taskbar-icon');
            spideyTaskbar.innerText = '🦠';
            
            // 4. Reliable Audio Activation
            playDoomAlarmSound();
        }
        
        setInterval(updateDoomTimer, 1000);
    </script>
